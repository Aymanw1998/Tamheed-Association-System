name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  client-build:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/system/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: apps/system
      - name: Build
        run: npm run build
        working-directory: apps/system
        env:
          CI: false
      - name: Client regression tests
        run: npm test
        working-directory: apps/system
        env:
          CI: true

  it-build:
    name: Build and test the IT site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/it/package-lock.json
      - name: Install IT site dependencies
        run: npm ci
        working-directory: apps/it
      - name: Build
        run: npm run build
        working-directory: apps/it
        env:
          CI: false
      - name: IT site tests
        run: npm test
        working-directory: apps/it
        env:
          CI: true

  server-check:
    name: Server syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Syntax-check all server JS files
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node --check
        working-directory: server
      - name: Server regression tests
        run: npm test
        working-directory: server
