# nginx site for Tamheed (see deploy/DEPLOY.md).
# Replace example.org with the real domain, copy to
# /etc/nginx/sites-available/tamheed and enable it. certbot adds the HTTPS
# (listen 443 / ssl_certificate) lines to this file automatically.

server {
    listen 80;
    server_name example.org;

    # Uploads arrive in chunks of up to 60 MB (STORAGE_CHUNK_MAX_MB).
    client_max_body_size 64m;

    # Live alerts and the assistant's chat are long-lived streams (SSE):
    # no buffering, long read timeout.
    location ~ ^/api/(live/stream|ai/chat) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Everything else: the API and the built web app (SERVE_CLIENT=true).
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# The sport site: the same server, told apart by the host name (SPORT_HOST).
server {
    listen 80;
    server_name sport.example.org;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
